<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050507">
<meta name="robots" content="noindex,nofollow">
<title>مكتب بولاتك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#050507;--s1:#0d0d12;--s2:#14141b;--ln:#24242e;--tx:#f4f4f7;--mu:#9a9aa8;--red:#ff1e42;--red2:#b3122e;--ok:#2fd27a;--warn:#ffb020;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#050507}
body{margin:0;background:radial-gradient(1200px 500px at 50% -10%,#2a0710 0,transparent 60%),var(--bg);color:var(--tx);font-family:'Cairo',system-ui,sans-serif;line-height:1.6;padding-bottom:84px;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:980px;margin:0 auto;padding:14px}
header.top{display:flex;align-items:center;gap:14px;padding:6px 2px 14px}
.cube3{width:44px;height:44px;perspective:200px;flex:none}
.cube3 i{display:block;width:100%;height:100%;position:relative;transform-style:preserve-3d;animation:spin 9s linear infinite}
.cube3 b{position:absolute;inset:0;border:2px solid var(--red);background:rgba(255,30,66,.18);box-shadow:inset 0 0 12px rgba(255,30,66,.5)}
.cube3 b:nth-child(1){transform:translateZ(22px)}.cube3 b:nth-child(2){transform:rotateY(90deg) translateZ(22px)}.cube3 b:nth-child(3){transform:rotateY(180deg) translateZ(22px)}.cube3 b:nth-child(4){transform:rotateY(-90deg) translateZ(22px)}.cube3 b:nth-child(5){transform:rotateX(90deg) translateZ(22px)}.cube3 b:nth-child(6){transform:rotateX(-90deg) translateZ(22px)}
@keyframes spin{to{transform:rotateX(-24deg) rotateY(360deg)}}
@media (prefers-reduced-motion:reduce){.cube3 i{animation:none;transform:rotateX(-24deg) rotateY(35deg)}}
h1{font-size:22px;margin:0;font-weight:900}
.sub{color:var(--mu);font-size:13px}
.card{background:linear-gradient(180deg,var(--s2),var(--s1));border:1px solid var(--ln);border-radius:var(--r);padding:14px}
.card.act{border-color:rgba(255,30,66,.55);box-shadow:0 0 0 1px rgba(255,30,66,.15),0 10px 40px -20px rgba(255,30,66,.6)}
.note{border:1px dashed rgba(255,30,66,.5);border-radius:14px;padding:11px 13px;font-size:13.5px;color:#ddd;background:rgba(255,30,66,.05)}
.note b{color:#ff6b82}
.grid{display:grid;gap:12px}
@media(min-width:700px){.grid.g2{grid-template-columns:1fr 1fr}.grid.g3{grid-template-columns:repeat(3,1fr)}}
.ag{display:flex;gap:12px;align-items:flex-start;cursor:pointer;text-align:right;width:100%}
.ag svg{width:54px;height:54px;flex:none}
.ag h3{margin:0;font-size:17px}
.ag .role{color:var(--mu);font-size:13px}
.st{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;margin-top:2px}
.dot{width:9px;height:9px;border-radius:50%;background:#555}
.st.on{color:var(--ok)}.st.on .dot{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.st.off{color:var(--mu)}
.ag p{margin:6px 0 0;font-size:14px;color:#cfcfd8}
.meta{font-size:12.5px;color:var(--mu);margin-top:6px}
nav.bn{position:fixed;bottom:0;inset-inline:0;background:rgba(8,8,11,.92);backdrop-filter:blur(14px);border-top:1px solid var(--ln);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:20}
nav.bn .in{display:flex;max-width:980px;width:100%;gap:2px}
nav.bn button{flex:1;min-width:0;font-size:10.5px!important;background:none;border:0;padding:6px 2px;color:var(--mu);font-size:11.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;cursor:pointer;border-radius:12px}
nav.bn button svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.bn button.on{color:var(--red)}
.badge{position:absolute;top:0;inset-inline-start:calc(50% + 6px);background:var(--red);color:#fff;border-radius:99px;font-size:10.5px;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px}
.btn{background:var(--s2);border:1px solid var(--ln);border-radius:12px;padding:9px 14px;font-weight:700;cursor:pointer;font-size:14px}
.btn.pri{background:linear-gradient(135deg,var(--red),var(--red2));border-color:transparent;color:#fff}
.btn.ok{background:rgba(47,210,122,.14);border-color:rgba(47,210,122,.5);color:var(--ok)}
.btn.no{background:rgba(255,30,66,.1);border-color:rgba(255,30,66,.4);color:#ff6b82}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=search],input[type=url],select,textarea{width:100%;background:#09090d;border:1px solid var(--ln);border-radius:12px;padding:10px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--red)}
textarea{min-height:90px;resize:vertical}
h2{font-size:18px;margin:18px 0 10px}
.tabs{display:flex;gap:6px;margin:6px 0 12px;overflow:auto}
.tabs button{white-space:nowrap}
.tag{display:inline-block;border:1px solid var(--ln);border-radius:99px;padding:1px 9px;font-size:12px;color:var(--mu)}
.tag.r{border-color:rgba(255,30,66,.5);color:#ff6b82}.tag.g{border-color:rgba(47,210,122,.5);color:var(--ok)}.tag.y{border-color:rgba(255,176,32,.5);color:var(--warn)}
.empty{text-align:center;color:var(--mu);padding:26px 12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 10px;border-bottom:1px solid var(--ln);text-align:right;vertical-align:top}
th{color:var(--mu);font-size:12.5px;position:sticky;top:0;background:var(--s1)}
.tw{max-height:70vh;overflow:auto;border:1px solid var(--ln);border-radius:var(--r)}
.pc{display:grid;gap:4px}
.pc .nm{font-weight:800}
.hide-d{display:block}.show-d{display:none}
@media(min-width:900px){.hide-d{display:none}.show-d{display:block}}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--ln);background:var(--s1);border-radius:99px;padding:5px 12px;font-size:13px;cursor:pointer;font-weight:600}
.chip.on{border-color:var(--red);color:#fff;background:rgba(255,30,66,.18)}
pre{background:#09090d;border:1px solid var(--ln);border-radius:12px;padding:12px;overflow:auto;font-size:12px;direction:ltr;text-align:left;white-space:pre-wrap}
.kv{display:grid;gap:6px;font-size:14px}
.ls li{margin:4px 0}.ls{padding-inline-start:18px;margin:6px 0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:40;display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.sheet{background:var(--s1);border:1px solid var(--ln);border-radius:22px 22px 0 0;width:100%;max-width:640px;max-height:88vh;overflow:auto;padding:16px}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:22px}}
.toast{position:fixed;bottom:92px;inset-inline:0;margin:auto;width:max-content;max-width:90%;background:#1b1b24;border:1px solid var(--red);border-radius:12px;padding:9px 14px;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:.25s}
.toast.on{opacity:1}
a{color:#ff6b82}
.small{font-size:12.5px;color:var(--mu)}
.msgs{display:flex;flex-direction:column;gap:8px;padding:8px 0;min-height:200px}
.bub{max-width:86%;border-radius:16px;padding:8px 12px;font-size:14.5px;white-space:pre-wrap;word-break:break-word;background:var(--s2);border:1px solid var(--ln);align-self:flex-start}
.bub.me{align-self:flex-end;background:rgba(255,30,66,.16);border-color:rgba(255,30,66,.45)}
.bub .who{font-size:12px;font-weight:800;color:#ff6b82;display:flex;gap:6px;align-items:center}
.bub .tm{font-size:11px;color:var(--mu)}
.composer{position:sticky;bottom:72px;background:linear-gradient(180deg,transparent,var(--bg) 25%);padding-top:10px}
.composer .row{align-items:flex-end;flex-wrap:nowrap}
.composer textarea{min-height:46px;max-height:140px;flex:1}
.mode{border:1px solid var(--ln);border-radius:12px;padding:8px 12px;font-size:13px}
.mode.live{border-color:rgba(47,210,122,.5);color:var(--ok)}

/* v4 look */
body{background:radial-gradient(900px 420px at 85% -8%,rgba(255,30,66,.28),transparent 60%),radial-gradient(700px 400px at 0% 0%,#1a0409,transparent 60%),linear-gradient(#050507,#050507);background-attachment:fixed}
body:before{content:"";position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(ellipse at 50% 0,#000 0,transparent 70%);mask-image:radial-gradient(ellipse at 50% 0,#000 0,transparent 70%);pointer-events:none;z-index:-1}
header.top{background:linear-gradient(135deg,rgba(255,30,66,.14),rgba(255,255,255,.02));border:1px solid rgba(255,30,66,.28);border-radius:22px;padding:14px 16px;margin-bottom:12px;backdrop-filter:blur(10px);box-shadow:0 20px 60px -30px rgba(255,30,66,.7)}
.cube3{width:50px;height:50px;filter:drop-shadow(0 0 14px rgba(255,30,66,.6))}
h1{background:linear-gradient(90deg,#fff,#ff8da0);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:24px;letter-spacing:.2px}
.card{background:linear-gradient(180deg,rgba(28,28,38,.85),rgba(13,13,18,.9));backdrop-filter:blur(8px);transition:transform .15s,border-color .2s}
.card.ag:hover,.card.cn:hover{transform:translateY(-2px);border-color:rgba(255,30,66,.5)}
.btn{transition:.15s}.btn:active{transform:scale(.97)}.btn.pri{box-shadow:0 8px 24px -10px rgba(255,30,66,.9)}
.btn[disabled]{opacity:.55}
nav.bn{inset-inline:8px;bottom:8px;border:1px solid var(--ln);border-radius:22px;background:rgba(10,10,14,.82);box-shadow:0 10px 40px rgba(0,0,0,.6)}
nav.bn button.on{background:rgba(255,30,66,.12)}
nav.bn button span{font-size:10px}
h2{display:flex;align-items:center;gap:8px}h2:before{content:"";width:4px;height:18px;border-radius:3px;background:linear-gradient(var(--red),var(--red2))}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 12px}
.stat{background:rgba(255,255,255,.03);border:1px solid var(--ln);border-radius:16px;padding:10px 6px;text-align:center}
.stat b{display:block;font-size:22px;font-weight:900;color:#fff;line-height:1.2}.stat span{font-size:11.5px;color:var(--mu)}
.stat.hot b{color:var(--red)}
code{background:#09090d;border:1px solid var(--ln);border-radius:6px;padding:0 5px;font-size:12.5px}
label.small{display:block}label.small input,label.small select{margin-top:4px}

/* v5 look */
:root{--r:20px}
body{font-feature-settings:"ss01"}
header.top{position:sticky;top:8px;z-index:15;border-radius:24px;background:linear-gradient(135deg,rgba(255,30,66,.2),rgba(10,10,14,.82) 60%);box-shadow:0 18px 50px -24px rgba(255,30,66,.8),inset 0 1px 0 rgba(255,255,255,.06)}
header.top .hq{margin-inline-start:auto;white-space:nowrap}
.sub{font-size:12px}
.card.agc{padding:0;overflow:hidden;position:relative}
.card.agc:before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:3px;background:var(--ln)}
.card.agc.act:before{background:linear-gradient(var(--red),var(--red2))}.card.agc.wrn:before{background:var(--warn)}
.card.agc.wrn{border-color:rgba(255,176,32,.45)}
.card.agc .ag{padding:14px 14px 8px}
.card.agc .ctl{padding:8px 14px 12px;border-top:1px solid var(--ln);background:rgba(0,0,0,.18)}
.pill{display:inline-flex;align-items:center;gap:7px;border-radius:99px;padding:3px 11px;font-size:12.5px;font-weight:800;border:1px solid var(--ln);color:var(--mu);margin:3px 0}
.pill i{width:8px;height:8px;border-radius:50%;background:#555}
.pill.on{color:var(--ok);border-color:rgba(47,210,122,.45);background:rgba(47,210,122,.08)}.pill.on i{background:var(--ok)}
.pill.warn{color:var(--warn);border-color:rgba(255,176,32,.5);background:rgba(255,176,32,.08)}.pill.warn i{background:var(--warn)}
.pill.live i{animation:pl 1.4s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(47,210,122,.7)}100%{box-shadow:0 0 0 9px rgba(47,210,122,0)}}
@media (prefers-reduced-motion:reduce){.pill.live i{animation:none}}
.stat.warnx b{color:var(--warn)}
.stats{grid-template-columns:repeat(4,1fr)}.stat span{font-size:11px;line-height:1.3;display:block}
input[type=time]{background:#09090d;border:1px solid var(--ln);border-radius:12px;padding:9px 8px;outline:none;color:var(--tx);color-scheme:dark}
.ctlbox{margin-bottom:6px}
.hrs{display:flex;justify-content:space-between;font-size:11px;color:var(--mu);direction:ltr;margin-bottom:4px}
.shr{display:grid;grid-template-columns:84px 1fr;gap:8px;align-items:center;margin:6px 0}
.shn{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.bar{display:grid;grid-template-columns:repeat(24,1fr);gap:2px;direction:ltr}
.bar i{height:16px;border-radius:3px;background:#1b1b24}.bar i.f{background:linear-gradient(var(--red),var(--red2))}.bar i.f2{background:#ff6b82}.bar i.gap{background:repeating-linear-gradient(45deg,#3a0f18,#3a0f18 3px,#1b1b24 3px,#1b1b24 6px)}
.shr.cv{border-top:1px dashed var(--ln);padding-top:8px;margin-top:10px}
.how{display:grid;gap:10px;margin:12px 0}
.hs{display:flex;gap:12px;background:linear-gradient(180deg,rgba(28,28,38,.8),rgba(13,13,18,.9));border:1px solid var(--ln);border-radius:var(--r);padding:12px}
.hs>b{flex:none;width:34px;height:34px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--red),var(--red2));color:#fff}
.hs h3{margin:0 0 2px;font-size:15.5px}.hs div{font-size:14px;color:#d6d6de}
nav.bn button{font-size:9.5px!important}nav.bn button span{font-size:9.5px}
nav.bn button svg{width:21px;height:21px}

/* v6 */
.dl{font-size:11.5px;color:var(--mu);margin-top:4px;border-top:1px dashed var(--ln);padding-top:4px}
select{margin:4px 0}
.bub{max-width:92%}
#tprev pre{max-height:50vh}
nav.bn button{font-size:11px!important}nav.bn button span{font-size:11px}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><div class="cube3"><i><b></b><b></b><b></b><b></b><b></b><b></b></i></div><div><h1>مكتب بولاتك</h1><div class="sub" id="hsub"></div></div><button class="btn sm hq" data-go="how" aria-label="كيف يشتغل">؟ كيف يشتغل</button></header>
<main id="main"></main>
</div>
<nav class="bn"><div class="in" id="nav"></div></nav>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script>
(()=>{
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const K={st:'bto_state_v1',pros:'bto_pros_v1',pst:'bto_pst_v1',feed:'bto_feed_v1',fb:'bto_fb_v1',imps:'bto_imports_v1',undo:'bto_undo_v1',conn:'bto_conn_v1',ctl:'bto_ctl_v1',train:'bto_train_v1'};
const ld=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){toast('المساحة المحلية ممتلئة');return false}};
const ICON={
 team:'<svg viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12L4 7.5M12 12v9"/></svg>',
 tasks:'<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12l3 3 5-6"/></svg>',
 appr:'<svg viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/><path d="M9 12l2 2 4-4"/></svg>',
 pros:'<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 19c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/><path d="M16 5.5a3 3 0 010 5.6M18 14c1.8.7 3 2.3 3 5"/></svg>',
 chat:'<svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/></svg>',
 train:'<svg viewBox="0 0 24 24"><path d="M12 3l9 4.5-9 4.5-9-4.5z"/><path d="M7 10.5V15c0 1.5 2.2 3 5 3s5-1.5 5-3v-4.5"/><path d="M21 7.5V13"/></svg>',
 clock:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',
 more:'<svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>',
 conn:'<svg viewBox="0 0 24 24"><rect x="3" y="8" width="7" height="8" rx="2"/><rect x="14" y="8" width="7" height="8" rx="2"/><path d="M10 12h4M6.5 8V5M17.5 8V5"/></svg>',
 rep:'<svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h7M9 9h2"/></svg>',
 link:'<svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1"/></svg>'
};
function cubeSvg(on){const a=on?'#ff3a5c':'#4a4a55',b=on?'#b3122e':'#2f2f38',c=on?'#ff1e42':'#3b3b45';
return `<svg viewBox="0 0 64 64"><path d="M32 6l22 12v26L32 58 10 44V18z" fill="${b}"/><path d="M32 6l22 12-22 12-22-12z" fill="${a}"/><path d="M32 30l22-12v26L32 58z" fill="${c}"/><path d="M32 30v28M10 18l22 12 22-12" stroke="#050507" stroke-opacity=".5" stroke-width="1.5" fill="none"/></svg>`}

/* ---------- team definition (duties are fixed text; status comes from state) ---------- */
const AGENTS=[
 {id:'omar',n:'عمر',r:'المدير',d:'يتابع مهام الفريق كله ويبلّغك أول ما أي شغلانة تخلص. بيحوّل أهدافك لمهام ويوزّعها.'},
 {id:'mai',n:'مي',r:'التسويق',d:'خطة المحتوى وأسبوع المنشورات ومسودات الرسائل.'},
 {id:'karim',n:'كريم',r:'المبيعات',d:'يجهّز مسودات رسائل للعملاء المحتملين من قايمة العملاء. مفيش رسالة بتتبعت من غير موافقتك.'},
 {id:'collector',n:'جامع البيانات',r:'تجميع وإثراء بيانات العملاء',d:'يجمع بيانات الشركات ويكمّل الناقص (تليفون، إيميل، موقع).'},
 {id:'outreach',n:'التواصل',r:'إرسال الرسائل',d:'ما يبعتش أي حاجة من غير موافقتك على الكلام والقناة.'},
 {id:'social',n:'الصفحات والإعلانات',r:'السوشيال والإعلانات',d:'ينشر ويدير الإعلانات بعد ما الصفحات تتوصّل وبموافقتك.'},
 {id:'convo',n:'صاحب محادثة العميل',r:'متابعة المحادثات',d:'يمسك محادثة كل عميل من أول رد لحد الاتفاق.'},
 {id:'yousef',n:'يوسف',r:'بناء المواقع',d:'يبني موقع أو سيستم لما عميل يطلب، تحت إشرافك.'},
 {id:'salma',n:'سلمى',r:'خدمة العملاء',d:'ترد على العملاء وتتابع طلباتهم وحالة كل واحد.'},
 {id:'hassan',n:'حسن',r:'المحاسب',d:'يسجّل المصاريف والتحصيلات. أي دفع أو تحصيل محتاج موافقتك.'}

  if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
  else if(c=='"')q=true;else if(c==','){r.push(f);f=''}
  else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;r.push(f);f='';if(r.length>1||r[0]!=='')rows.push(r);r=[]}
  else f+=c}

const FBV='11.6.1';
function rulesText(owner,agents){const ag=(agents||[]).filter(Boolean).map(x=>`'${x}'`).join(', ');
 return `rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    function owner() { return request.auth != null && request.auth.token.email_verified == true && request.auth.token.email == '${owner||'OWNER@EMAIL.COM'}'; }
    function agent() { return request.auth != null && request.auth.token.email in [${ag}]; }
    function only(keys) { return request.resource.data.diff(resource.data).affectedKeys().hasOnly(keys); }
    function msgOk() { return request.resource.data.text is string && request.resource.data.text.size() > 0 && request.resource.data.text.size() <= 1500
      && request.resource.data.room is string && request.resource.data.from is string
      && request.resource.data.t == request.time && request.resource.data.by == request.auth.token.email; }
    function trainOk() { return request.resource.data.instruction is string && request.resource.data.instruction.size() <= 6000; }
    match /office_chat/{id} {
      allow read: if owner() || agent();
      allow create: if (owner() && msgOk()) || (agent() && msgOk() && request.resource.data.from != 'bola');
      allow update: if (owner() && only(['ack', 'hidden'])) || (agent() && only(['ack']));
      allow delete: if false;
    }
    match /office_training/{id} {
      allow read: if owner() || agent();
      allow create: if owner() && trainOk();
      allow update: if (owner() && trainOk()) || (agent() && only(['trainAck']));
      allow delete: if false;
    }
    match /office_ctl/{id} {
      allow read: if owner() || agent();
      allow create, update: if owner() && request.resource.data.ut is number;
      allow delete: if false;
    }
    match /office_status/{id} {
      allow read: if owner() || agent();
      allow create, update: if (owner() || agent()) && request.resource.data.updated is number;
      allow delete: if false;
    }
  }
}`}
const BRIDGE=`// بروتوكول الجسر (بيعمله اللي بيشغّل الوكيل الخلفي، بحساب Firebase خاص بيه)

const hm=s=>{const m=/^(\d{1,2}):(\d{2})$/.exec(s||'');return m?(+m[1])*60+(+m[2]):null};
function onShiftAt(sh,day,min){for(const x of sh){const a=hm(x.from),b=hm(x.to);if(a==null||b==null)continue;const ds=x.days||[];
  if(a===b){if(ds.includes(day))return true}
  else if(a<b){if(ds.includes(day)&&min>=a&&min<b)return true}
  else{if(ds.includes(day)&&min>=a)return true;if(ds.includes((day+6)%7)&&min<b)return true}}return false}

 <div class="hs"><b>4</b><div><h3>زرار التشغيل والإيقاف</h3>للوكلاء الخلفيين هو <b>طلب</b> بتسجّله، وحالته "طلب مش متنفذ". لازم تقول لمساعدك (زرار "نسخ الطلبات") وهو ينفّذ، وبعدها تستورد ملف عمر فيتأكد. الصفحة ما بتقدرش تشغّل ولا توقّف حد منهم.</div></div>
 <div class="hs"><b>5</b><div><h3>التشغيل المحلي (الاستثناء الحقيقي)</h3>لو ربطت وكيل بموصّل (ChatGPT / Claude / Ollama / LM Studio) الصفحة نفسها بتشغّله فعلًا: بتبعت للموديل دور الوكيل والمهام المفتوحة عليه وتعرض الرد، مرة بزرار أو تلقائي بجدول. ده بيشتغل بس والتبويب مفتوح والجهاز صاحي. أي رد بيظهر مع وقته الحقيقي، وأي خطأ بيظهر زي ما هو.</div></div>
 <div class="hs"><b>6</b><div><h3>الورديات والتغطية</h3>الورديات خطة (صباحي / مسائي / ليلي). التطبيق بيطبّقها على التشغيل المحلي فقط: الوكيل المحلي بيشتغل جوه ورديته، ولو وقف أو خرج منها وكان له بديل محلي شغال، البديل بيشتغل بدوره. للخلفيين الورديات بتروح لمساعدك مع الطلبات.</div></div><div class="hs"><b>7</b><div><h3>الشات مع الوكلاء</h3>تكلّم أي وكيل لوحده أو قسم أو وردية أو الكل. الوكيل المربوط بموصّل بيرد فعلًا من الصفحة بموديل حقيقي. الوكيل الخلفي ما بيردّش إلا لو عنده جسر بيقرا قاعدة Firebase، ولحد وقتها رسالتك "مستنية". "وصلت للوكيل" و"اتقرت" مبتظهرش إلا لو الجسر كتبها فعلًا في القاعدة.</div></div><div class="hs"><b>8</b><div><h3>التدريب</h3>تعليمات ومعرفة وأمثلة وتصحيحات لكل وكيل، بنسخ مرقّمة. للمربوطين بتتحقن في تعليمات الموديل فعلًا. للخلفيين بتتخزن وبتستنى الجسر يقراها ويؤكد الاستلام.</div></div></div>
 <h2>اللي حقيقي واللي لأ</h2><div class="tw"><table><thead><tr><th>الحاجة</th><th>حقيقي؟</th><th>ملاحظة</th></tr></thead><tbody>
 ${row('حالة الوكيل الخلفي','من آخر ملف','قبل أول استيراد هي حالة مبدئية مش مؤكدة')}
 ${row('زرار الخلفي','طلب بس','مش بيغيّر حاجة عند الفريق')}
 ${row('تشغيل محلي بموصّل','حقيقي','والتبويب مفتوح، وبيتكلف عند الخدمات السحابية')}
 ${row('الورديات','خطة','بتتطبّق فعليًا على المحلي بس')}
 ${row('الموافقات والمهام والعملاء','حقيقية على جهازك','بتتحفظ في المتصفح ده بس')}
 ${row('شات ورد وكيل مربوط','حقيقي','موديل فعلي، وبيتحاسب عند السحابي')}
 ${row('شات مع وكيل خلفي','تخزين بس','رد/استلام فقط لو الجسر كتبهم في القاعدة')}

 ${row('إرسال لعملاء','مفيش','التطبيق ما بيبعتش ولا بيكلّم أي حد')}</tbody></table></div>

function vctl(t){const a=t.dataset.vact,id=t.dataset.id;
 if(a==='chatwith'){UI.room=id;UI.tab='chat';closeSheet();render();scrollTo(0,0);return}
 if(a==='trainwith'){UI.tag=id;TD=null;UI.tab='train';closeSheet();render();scrollTo(0,0);return}
 if(a==='presetall'){let n=0;for(const a2 of AGENTS){if(a2.shift&&!C(a2.id).shifts.length){const p=PRESETS[a2.shift];C(a2.id).shifts=[{...p,days:[0,1,2,3,4,5,6]}];saveCtl(a2.id);n++}}render();toast(n?'اتطبّقت ورديات على '+n+' وكيل':'مفيش وكيل محتاج');return}
 if(a==='start'){localStart(id);return}if(a==='stop'){localStop(id);return}
 if(a==='once'){if(!boundConn(id)){toast('اربط الوكيل بموصّل الأول');return}const cn=boundConn(id);if(PROV[cn.provider].cloud&&!confirm('ده هيبعت طلب فعلي لخدمة سحابية وبيتحاسب من حسابك. تكمّل؟'))return;toast('بيشغّل...');runAgent(id,id,true);return}
 if(a==='reqon'||a==='reqoff'){C(id).req={want:a==='reqon',at:Date.now()};saveCtl(id);render0();toast('اتسجّل كطلب بس. مفيش حاجة هتتنفذ لحد ما وكيل أو موصّل يطبّقه');return}
 if(a==='cancelreq'){C(id).req=null;saveCtl(id);render0();return}
 if(a==='copyreq'){copy(reqText()+'\n\nالورديات:\n'+(shiftsOut().map(s=>`- ${AMAP[s.agent].n}: ${shiftTxt(s.agent)}${s.backup?' (بديله '+AMAP[s.backup].n+')':''}`).join('\n')||'مفيش'));return}
 if(a==='savectl'){const c=C(id);const cap=parseInt($('#cx-cap').value,10);c.conn=$('#cx-c').value;c.every=+$('#cx-e').value||60;c.cap=cap>0&&cap<=96?cap:12;c.backup=$('#cx-b').value;const p=$('#cx-p').value.trim();c.prompt=p===sysPromptDefault(id)?'':p.slice(0,3000);if(!c.conn&&RUN[id])RUN[id].on=false;saveCtl(id);$('#sheet').innerHTML=agSheet(id);toast('اتحفظ');render();return}
 if(a==='resetp'){C(id).prompt='';saveCtl(id);$('#sheet').innerHTML=agSheet(id);return}
 if(a==='addsh'||a==='delsh'||a==='savesh'||a==='dayt'){
  if(a==='dayt'){t.classList.toggle('on');return}
  const c=C(id);const rd=()=>[...document.querySelectorAll('.shc')].map(e=>({name:e.querySelector('.sn').value.trim().slice(0,30),from:e.querySelector('.sf').value||'08:00',to:e.querySelector('.st2').value||'16:00',days:[...e.querySelectorAll('.dy')].map((x,j)=>x.classList.contains('on')?j:-1).filter(j=>j>=0)}));
  if(a==='savesh'){c.shifts=rd();saveCtl(id);$('#sheet').innerHTML=agSheet(id);render();toast('اتحفظت الورديات');return}
  c.shifts=rd();if(a==='delsh')c.shifts.splice(+t.dataset.i,1);else{const p=PRESETS[t.dataset.p]||{name:'وردية',from:'09:00',to:'17:00'};c.shifts.push({...p,days:[0,1,2,3,4,5,6]})}
  saveCtl(id);$('#sheet').innerHTML=agSheet(id);return}
 if(a==='shday'){SH=+t.dataset.j;render();return}
 if(a==='r2d'){const r=C(id).runs.find(x=>String(x.t)===t.dataset.t);if(!r||!r.ok)return;S.drafts.push({id:uid(),agent:id,kind:'other',channel:'other',to:'',phone:'',title:'ناتج تشغيل محلي',body:r.text,state:'pending',created:Date.now()});save();toast('اتضافت في الموافقات كمسودة منتظرة');render();return}}
function sysPromptDefault(id){const k=C(id).prompt;C(id).prompt='';const d=sysPrompt(id);C(id).prompt=k;const tt=trainText(id);return tt?d.slice(0,d.length-tt.length):d}

function render(){hdr();nav();const m=$('#main');
 m.innerHTML=({team:vTeam,tasks:vTasks,approvals:vApprovals,report:vReport,chat:vChat,train:vTrain,conn:vConn,shifts:vShifts,more:vMore,how:vHow,pros:vPros,link:vLink})[UI.tab]();}

/* ---------- import ---------- */
function doImport(txt,src){let d;try{d=JSON.parse(txt)}catch(e){toast('الملف مش JSON صحيح');return false}
 if(!d||typeof d!=='object'){toast('صيغة غير معروفة');return false}
 let na=0,nt=0,nd=0;const now=Date.now();
 for(const a of (d.agents||[])){if(!AMAP[a.id])continue;const c=S.agents[a.id];if('on' in a)c.on=!!a.on;if(typeof a.line==='string')c.line=a.line;if(typeof a.sch==='string')c.sch=a.sch;c.updated=d.updated||new Date().toISOString();na++}
 for(const t of (d.tasks||[])){const m=S.tasks.find(x=>x.id===t.id);if(m){if(['todo','doing','done'].includes(t.state))m.state=t.state;if(typeof t.note==='string')m.note=t.note;nt++}}
 for(const x of (d.drafts||[])){if(!x||!x.id||typeof x.body!=='string')continue;if(S.drafts.find(y=>y.id===x.id))continue;
  S.drafts.push({id:String(x.id),agent:AMAP[x.agent]?x.agent:'omar',kind:x.kind||'other',channel:x.channel||'other',to:x.to||'',phone:x.phone||'',title:x.title||'',body:x.body,state:'pending',created:now});nd++}
 S.imported=new Date().toISOString();save();render();
 toast(`تم: ${na} حالة، ${nt} مهمة، ${nd} مسودة جديدة (${src})`);return true}
function hashS(t){let h=0;for(let i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))|0;return h}
async function pollFeed(manual){const f=ld(K.feed,{url:''});if(!f.url)return;
 try{const r=await fetch(f.url,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const t=await r.text();f.err='';f.last=new Date().toISOString();sv(K.feed,f);const h=hashS(t);if(h!==f.hash||manual){f.hash=h;sv(K.feed,f);startImport(t,'رابط الملف')}}
 catch(e){f.err=String(e.message||e);f.last=f.last||null;sv(K.feed,f);if(manual)toast('تعذّر الجلب: '+f.err);if(UI.tab==='link')render()}}
function stateOut(){return JSON.stringify({exportedAt:new Date().toISOString(),decisions:S.drafts.filter(d=>d.state&&d.state!=='pending').map(d=>({id:d.id,agent:d.agent,state:d.state,decidedAt:d.decidedAt?new Date(d.decidedAt).toISOString():null,body:d.body})),tasks:S.tasks.map(t=>({id:t.id,agent:t.agent,text:t.text,state:t.state||'todo',created:new Date(t.created).toISOString()})),chatFromBola:S.chat.filter(m=>m.from==='bola'&&m.src==='local').map(m=>({id:m.id,room:m.room,text:m.text,t:new Date(m.t).toISOString()})),agentRequests:reqOut(),shifts:shiftsOut(),prospectStatuses:Object.entries(PS).map(([k,v])=>({business:k.split('|').slice(1).join('|'),status:v.s||'new',note:v.n||''})).filter(x=>x.status!=='new'||x.note)},null,1)}

 if(t.dataset.copydraft){const d=S.drafts.find(x=>x.id===t.dataset.copydraft);if(d)copy(d.body);return}
 if(t.dataset.deltask){if(confirm('مسح المهمة؟')){S.tasks=S.tasks.filter(x=>x.id!==t.dataset.deltask);save();render()}return}
 if('has' in t.dataset){UI.pf.has=t.dataset.has;UI.pshow=60;render();return}
 if('pst' in t.dataset){UI.pf.st=t.dataset.pst;UI.pshow=60;render();return}
 if(t.dataset.pr){openSheet(prSheet(t.dataset.pr));return}
 if(t.dataset.setp){const k=t.dataset.k;PS[k]=PS[k]||{};PS[k].s=t.dataset.setp;PS[k].t=Date.now();sv(K.pst,PS);openSheet(prSheet(k));render();return}
 if(t.dataset.savepn){const k=t.dataset.savepn;PS[k]=PS[k]||{};PS[k].n=$('#pn').value;sv(K.pst,PS);toast('اتحفظت الملاحظة');return}
 const a=t.dataset.act;
 if(a==='addtask'){const v=$('#tt').value.trim();if(!v){toast('اكتب المهمة الأول');return}S.tasks.unshift({id:uid(),agent:$('#tag').value,text:v,state:'todo',created:Date.now()});save();render();toast('اتحفظت. لسه الفريق ما شافهاش، انسخها وابعتها لعمر');return}
 if(a==='copytasks'){const o=S.tasks.filter(t=>t.state!=='done');if(!o.length){toast('مفيش مهام مفتوحة');return}copy('مهام مفتوحة من مكتب بولاتك (رقم المهمة | المسؤول | النص):\n'+o.map(t=>`${t.id} | ${AMAP[t.agent].n} | ${t.text}`).join('\n'));return}

 if(a==='meet'){openSheet(`<div class="row" style="justify-content:space-between"><h2 style="margin:0">اجتماع فريق: ${esc(roomName(UI.room))}</h2><button class="btn sm" data-close>إغلاق</button></div><p class="small">كل وكيل موصّل بيرد بالدور بموديل حقيقي وبتدريبه، وكل واحد بيشوف اللي قبله، وفي الآخر عمر بيلخّص (لو موصّل). الحد 10 وكلاء. اللي مش موصّل مش بيشارك. ما بيتبعتش حاجة لحد برّه.</p><textarea id="mt" placeholder="موضوع الاجتماع"></textarea><div class="row" style="margin-top:8px"><button class="btn pri" data-act="meetgo">ابدأ</button></div>`);return}
